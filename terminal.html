<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZACH_CORE Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap');
        body { font-family: 'Fira Code', monospace; }
        .terminal-bg { background: radial-gradient(circle at top left, #1a1b26, #11111b); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b4261; border-radius: 10px; }
        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #7aa2f7;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script defer src="/palette.js"></script>
    <script defer src="/telemetry.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZACH_CORE">
    <link rel="apple-touch-icon" href="/icon.svg">
    <script defer src="/mobile.js"></script>
</head>
<body class="terminal-bg min-h-screen text-[#c0caf5] flex flex-col">

    <nav class="flex items-center justify-between px-6 py-4 border-b border-[#24283b] bg-[#1a1b26]/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="flex gap-1.5">
                <div class="w-3 h-3 rounded-full bg-[#f7768e]"></div>
                <div class="w-3 h-3 rounded-full bg-[#e0af68]"></div>
                <div class="w-3 h-3 rounded-full bg-[#9ece6a]"></div>
            </div>
            <span class="text-[10px] font-bold tracking-[0.3em] uppercase text-[#565f89] ml-4">System_Terminal_v3</span>
        </div>
        <button onclick="location.href='/'" class="text-[#565f89] hover:text-[#f7768e] transition-colors text-xs font-bold uppercase tracking-widest">
            Terminate_Session [esc]
        </button>
    </nav>

    <main id="terminal-scroll" class="flex-grow overflow-y-auto p-6 custom-scrollbar">
        <div class="max-w-5xl mx-auto space-y-2">
            <div class="text-[#565f89] text-[11px] mb-8 leading-relaxed">
                <p>ZACH_CORE [Version 1.0]</p>
                <p>(c) Zach Bot. All rights reserved.</p>
                <p class="mt-2 text-[#7aa2f7]">● WebSocket Status: Connected</p>
            </div>

            <div id="log-container" class="space-y-1"></div>

            <form id="terminal-form" class="flex items-start gap-3 mt-4">
                <span class="text-[#9ece6a] font-bold">❯</span>
                <div class="flex-grow relative">
                    <input type="text" id="command-input" 
                        class="w-full bg-transparent border-none outline-none text-[#bb9af7] caret-transparent" 
                        autofocus spellcheck="false" autocomplete="off">
                    <div id="visual-cursor" class="cursor-blink absolute"></div>
                </div>
            </form>
        </div>
    </main>

    <footer class="px-6 py-2 border-t border-[#24283b] bg-[#16161e] text-[9px] text-[#565f89] flex justify-between uppercase tracking-widest">
        <span>Encoding: UTF-8</span>
        <span>Target: Remote_Node_Server</span>
    </footer>

    <script>
        const input = document.getElementById('command-input');
        const output = document.getElementById('log-container');
        const form = document.getElementById('terminal-form');
        const scrollContainer = document.getElementById('terminal-scroll');
        const visualCursor = document.getElementById('visual-cursor');

        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onmessage = (event) => appendOutput(event.data);
        
        ws.onerror = () => appendOutput("CORE_ERROR: Connection failed", false, "text-[#f7768e]");

        input.addEventListener('input', () => {
            const textWidth = getTextWidth(input.value);
            visualCursor.style.left = `${textWidth}px`;
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const cmd = input.value.trim();
            if (!cmd) return;

            appendOutput(cmd, true);

            if (cmd.toLowerCase() === 'clear') {
                output.innerHTML = '';
            } else if (cmd.toLowerCase() === 'exit') {
                ws.send('SIGINT_EXEC');
                appendOutput("Process Terminated via SIGINT", false, "text-[#e0af68]");
            } else {
                ws.send(cmd);
            }

            input.value = '';
            visualCursor.style.left = '0px';
            scrollToBottom();
        });

        function appendOutput(text, isCommand = false, customClass = "text-[#c0caf5]") {
            const div = document.createElement('div');
            if (isCommand) {
                div.innerHTML = `<span class="text-[#9ece6a] mr-3">❯</span><span class="text-[#bb9af7]">${text}</span>`;
            } else {
                div.className = `text-sm leading-relaxed whitespace-pre-wrap ${customClass}`;
                div.innerText = text;
            }
            output.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }

        function getTextWidth(text) {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            context.font = "16px 'Fira Code'";
            return context.measureText(text).width;
        }

        document.addEventListener('click', () => input.focus());
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') location.href = '/';
        });
    </script>
</body>
</html>
